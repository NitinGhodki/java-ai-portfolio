# Server & App Config
server.port=${PORT:8080}
spring.application.name=enterprise-ai-gateway

# Spring AI ? HuggingFace
spring.ai.openai.api-key=${HF_API_KEY}
spring.ai.openai.base-url=https://router.huggingface.co
spring.ai.openai.chat.options.model=google/gemma-4-26B-A4B-it
spring.ai.openai.chat.options.max-tokens=512
spring.ai.openai.chat.options.temperature=0.7

# LangChain4j ? HuggingFace
langchain4j.open-ai.chat-model.api-key=${HF_API_KEY}
langchain4j.open-ai.chat-model.base-url=https://router.huggingface.co
langchain4j.open-ai.chat-model.model-name=google/gemma-4-26B-A4B-it
langchain4j.open-ai.chat-model.max-tokens=512
langchain4j.open-ai.chat-model.temperature=0.7

# Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2:latest
spring.ai.ollama.chat.options.temperature=0.7

# Caching
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=3600s

# Actuator
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.info.env.enabled=true

# Info endpoint
info.app.name=Enterprise AI Gateway
info.app.description=Production Java AI system with RAG, agents, guardrails
info.app.version=1.0.0
info.app.java-version=21
info.app.frameworks=Spring AI 1.0, LangChain4j 0.36

# Logging
logging.level.com.aiportfolio=INFO
logging.level.org.springframework.ai=WARN
logging.level.dev.langchain4j=WARN

# File upload (for vision endpoints)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom path for the Swagger UI HTML page
springdoc.swagger-ui.path=/swagger-ui.html

# Custom path for the raw OpenAPI JSON specification
springdoc.api-docs.path=/api-docs

# --- Model router thresholds---------------------
app.router.simple-threshold=0.3
app.router.complex-threshold=0.7
app.router.max-local-tokens=200

# Custom metric prefix for your app
management.metrics.tags.application=${spring.application.name}