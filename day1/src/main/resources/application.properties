# Server
server.port=8080
spring.application.name=java-ai-week-a

# Spring AI ? HuggingFace via OpenAI-compatible endpoint
# HuggingFace exposes an OpenAI-compatible API at this base URL
# Spring AI's OpenAI client works with it without any code changes
spring.ai.openai.api-key=${HF_API_KEY}
spring.ai.openai.base-url=https://router.huggingface.co
spring.ai.openai.chat.options.model=Qwen/Qwen2.5-7B-Instruct
spring.ai.openai.chat.options.max-tokens=512
spring.ai.openai.chat.options.temperature=0.7

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
# Set to DEBUG to see full HTTP requests to HuggingFace
logging.level.org.springframework.ai=INFO
logging.level.com.aiportfolio=DEBUG